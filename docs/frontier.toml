# ECRuntime formalization queue -- machine-readable single source of truth.
#
# "What to do next" previously lived as prose in six documents at three time
# horizons. This file holds the structured form; the prose keeps its own voice
# and `scripts/hygiene.py` can cross-check the two.
#
# status values:
#   promoted  -- compiler-promoted, full gate green
#   active    -- the current stage target
#   open      -- ready to attempt, dependencies met
#   blocked   -- needs a semantic framework the repository lacks
#
# Ingredients are the near-term dependency ledger for the active paper (A1).
# Targets are the literature frontier: 35 entries across 33 papers, tiered by
# how much new semantic machinery each one forces.

[meta]
checkpoint = "stage-79-fix-1"
active_target = "A1"
toolchain = "leanprover/lean4:v4.32.1"
mathlib = "v4.32.1"

