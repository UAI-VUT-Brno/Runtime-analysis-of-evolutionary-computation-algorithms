# ECRuntime formalization queue -- machine-readable single source of truth.
#
# "What to do next" previously lived as prose in six documents at three time
# horizons. This file holds the structured form; the prose keeps its own voice.
# No automated cross-check exists: the script that claimed to do it never ran, and
# `scripts/audit.lean` reads the compiled environment, not this file. Keeping the two
# in sync is manual.
#
# Reconciled with the 547-module merge on 26 October 2026: each entry was checked
# against the merged Lean statements and docs/current/papers/, which stay
# authoritative for per-paper coverage. Each target's `paper_file` (relative to this
# directory) holds its paper's references and frontier assessment.
#
# status values:
#   promoted  -- compiler-promoted through a recorded stage, full gate green
#   merged    -- certified by the 547-module merge (full gate green in
#                `verify.ps1 -Stage merge-547`), not through a recorded stage
#   active    -- the current stage target
#   open      -- ready to attempt, dependencies met
#   blocked   -- needs a semantic framework the repository lacks
#
# Ingredients are the near-term dependency ledger for the active paper (A1).
# Targets are the literature frontier, tiered by how much new semantic machinery
# each one forces. Tier M holds open headline results of papers that the merge
# covered only in part; their `new_framework` has not been assessed yet.

[meta]
checkpoint = "merge-547"
active_target = "A1"
toolchain = "leanprover/lean4:v4.32.1"
mathlib = "v4.32.1"

